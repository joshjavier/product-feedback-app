services:
  db:
    container_name: product-feedback-db
    image: mongo:8.0.4
    restart: always
    environment:
      MONGO_INITDB_DATABASE: product-feedback
    ports:
      - 27017:27017
    volumes:
      - ./.docker/seed-mongodb.js:/docker-entrypoint-initdb.d/seed-mongodb.js
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container:
